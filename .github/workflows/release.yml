# Tag-triggered release. This file does not build or sign.
# It calls notarize.yml, which Developer ID-signs, notarizes, staples,
# signs the Sparkle appcast, and publishes the GitHub Release.
# Missing signing or notary secrets fail that job. There is no ad-hoc fallback.
# Dry-runs stay on Notarize (workflow_dispatch) and do not publish.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: write

jobs:
  release:
    name: release
    uses: ./.github/workflows/notarize.yml
    with:
      publish: true
    secrets: inherit
