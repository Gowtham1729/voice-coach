# Notarized direct download: Developer ID, inside-out Sparkle signing, notarize, staple, appcast.
# The human download is a disk image with Ichido beside Applications. Sparkle stays on the zip.
# - workflow_dispatch: same path, artifacts only. Does not create a GitHub Release.
# - release.yml calls this on a v* tag with publish: true and publishes the stapled zip and disk image.
# Missing signing or notary secrets fail the job. There is no ad-hoc fallback.
#
# GitHub Actions secrets (names only; values stay out of the repo):
#   CSC_P12_BASE64              base64 of the Developer ID Application .p12
#   CSC_P12_PASSWORD            password for that .p12
#   NOTARY_KEY                  notarytool API .p8 PEM, or base64 of that file
#   NOTARY_KEY_ID               API key id
#   NOTARY_ISSUER               API issuer id
#   SPARKLE_ED25519_PRIVATE_KEY existing Sparkle Ed25519 secret; do not rotate it
#
# The certificate common name is read from the imported .p12. It is not stored here.
# Team ID is 88HMB5SB4X.
name: Notarize

on:
  workflow_call:
    inputs:
      publish:
        description: Publish the GitHub Release for the v* tag that called this workflow.
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      publish:
        description: Leave this off. A manual run does not publish a GitHub Release.
        type: boolean
        required: false
        default: false

# contents: write lets a tag publish the GitHub Release. workflow_dispatch does not publish.
permissions:
  contents: write
  actions: write

jobs:
  notarize:
    name: notarize
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Show toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          swift --version

      - name: Resolve version
        id: version
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          PLIST_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          else
            VERSION="${PLIST_VERSION}"
            TAG="v${VERSION}"
          fi
          if [[ -z "${VERSION}" || "${VERSION}" == v* || "${VERSION}" == "${TAG}" ]]; then
            echo "Expected a version without a v prefix (got '${VERSION}', tag '${TAG}')" >&2
            exit 1
          fi
          if [[ "${VERSION}" != "${PLIST_VERSION}" ]]; then
            echo "Tag version ${VERSION} does not match app version ${PLIST_VERSION}" >&2
            exit 1
          fi
          if [[ "${PUBLISH}" == "true" && "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "A GitHub Release is created only from a v* tag. Refusing to publish." >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "Resolved VERSION=${VERSION} TAG=${TAG}"

      - name: Require signing secrets
        env:
          CSC_P12_BASE64: ${{ secrets.CSC_P12_BASE64 }}
          CSC_P12_PASSWORD: ${{ secrets.CSC_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in CSC_P12_BASE64 CSC_P12_PASSWORD NOTARY_KEY NOTARY_KEY_ID NOTARY_ISSUER SPARKLE_ED25519_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "Missing GitHub Actions secret: ${name}" >&2
              missing=1
            fi
          done
          if [[ "${missing}" -ne 0 ]]; then
            echo "Notarization does not fall back to an ad-hoc signature." >&2
            exit 1
          fi

      - name: Import Developer ID and select the team identity
        env:
          CSC_P12_BASE64: ${{ secrets.CSC_P12_BASE64 }}
          CSC_P12_PASSWORD: ${{ secrets.CSC_P12_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          TEAM_ID="88HMB5SB4X"
          KEYCHAIN="${RUNNER_TEMP}/ichido-signing.keychain-db"
          P12="${RUNNER_TEMP}/developer-id.p12"
          rm -f "$P12"
          trap 'rm -f "$P12"' EXIT

          if ! printf '%s' "$CSC_P12_BASE64" | tr -d '[:space:]' | base64 -D > "$P12"; then
            echo "CSC_P12_BASE64 is not valid base64." >&2
            exit 1
          fi
          if [[ ! -s "$P12" ]]; then
            echo "Decoded CSC_P12_BASE64 was empty." >&2
            exit 1
          fi

          # Save the search list before create-keychain adds the temporary keychain.
          security list-keychains -d user | sed 's/^[[:space:]]*//' > "${RUNNER_TEMP}/ichido-keychain-list.txt"

          keychain_password="$(openssl rand -base64 32)"
          if [[ -f "$KEYCHAIN" ]]; then
            security delete-keychain "$KEYCHAIN" || rm -f "$KEYCHAIN"
          fi
          security create-keychain -p "$keychain_password" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN"
          # Keep the previous keychains, and add the temporary one.
          set -f
          security list-keychains -d user -s "$KEYCHAIN" $(sed 's/"//g' "${RUNNER_TEMP}/ichido-keychain-list.txt")
          set +f

          security import "$P12" -k "$KEYCHAIN" -P "$CSC_P12_PASSWORD" -f pkcs12 -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$KEYCHAIN"
          rm -f "$P12"

          identities="$(security find-identity -v -p codesigning "$KEYCHAIN")"
          identity="$(printf '%s\n' "$identities" | zsh ./scripts/select-developer-id.sh "$TEAM_ID")"
          echo "Selected identity: ${identity}"

          delimiter="ICHIDO_SIGN_IDENTITY_$(openssl rand -hex 16)"
          {
            echo "SIGN_IDENTITY<<${delimiter}"
            printf '%s\n' "$identity"
            echo "${delimiter}"
          } >> "$GITHUB_ENV"

      - name: Run tests
        run: ./scripts/test.sh --all

      - name: Build and sign with Developer ID
        run: |
          set -euo pipefail
          if [[ -z "${SIGN_IDENTITY:-}" || "${SIGN_IDENTITY}" == "-" ]]; then
            echo "SIGN_IDENTITY is missing. Refusing an ad-hoc signature." >&2
            exit 1
          fi
          export SIGN_KEYCHAIN="${RUNNER_TEMP}/ichido-signing.keychain-db"
          ./scripts/build-app.sh --developer-id "$SIGN_IDENTITY"
          test -d "build/Ichido.app"

      - name: Zip app for notarization
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ZIP="Ichido-${VERSION}-macOS.zip"
          rm -f "${ZIP}"
          ditto -c -k --sequesterRsrc --keepParent \
            "build/Ichido.app" \
            "${ZIP}"
          test -s "${ZIP}"
          ls -lh "${ZIP}"

      - name: Notarize
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          ./scripts/notarize-submit.sh "Ichido-${VERSION}-macOS.zip"

      - name: Staple and assess
        run: |
          set -euo pipefail
          stapled=0
          for attempt in 1 2 3 4 5; do
            if xcrun stapler staple "build/Ichido.app"; then
              stapled=1
              break
            fi
            if [[ "$attempt" -lt 5 ]]; then
              sleep 20
            fi
          done
          if [[ "$stapled" -ne 1 ]]; then
            echo "stapler staple failed." >&2
            exit 1
          fi
          xcrun stapler validate "build/Ichido.app"
          accepted=0
          spctl_out=""
          for attempt in 1 2 3 4 5; do
            if spctl_out="$(/usr/sbin/spctl -a -vvv -t install "build/Ichido.app" 2>&1)" \
              && printf '%s\n' "$spctl_out" | grep -q "Notarized Developer ID"; then
              accepted=1
              break
            fi
            if [[ "$attempt" -lt 5 ]]; then
              sleep 20
            fi
          done
          printf '%s\n' "$spctl_out"
          if [[ "$accepted" -ne 1 ]]; then
            echo "spctl did not accept the app as Notarized Developer ID." >&2
            exit 1
          fi

      - name: Zip the stapled app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ZIP="Ichido-${VERSION}-macOS.zip"
          rm -f "${ZIP}"
          ditto -c -k --sequesterRsrc --keepParent \
            "build/Ichido.app" \
            "${ZIP}"
          test -s "${ZIP}"
          mkdir -p release-assets
          mv "${ZIP}" "release-assets/${ZIP}"

      - name: Generate signed Sparkle appcast
        env:
          SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ -z "${SPARKLE_ED25519_PRIVATE_KEY}" ]]; then
            echo "Missing SPARKLE_ED25519_PRIVATE_KEY GitHub Actions secret" >&2
            exit 1
          fi
          SPARKLE_BIN=".build/artifacts/sparkle/Sparkle/bin"
          printf '%s' "${SPARKLE_ED25519_PRIVATE_KEY}" | \
            "${SPARKLE_BIN}/generate_appcast" \
              --ed-key-file - \
              --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/" \
              --maximum-deltas 0 \
              -o "$PWD/release-assets/appcast.xml" \
              release-assets
          printf '%s' "${SPARKLE_ED25519_PRIVATE_KEY}" | \
            "${SPARKLE_BIN}/sign_update" --ed-key-file - --verify release-assets/appcast.xml
          xmllint --noout release-assets/appcast.xml
          if ! grep -q "Ichido-${VERSION}-macOS.zip" release-assets/appcast.xml; then
            echo "Appcast is missing the versioned zip." >&2
            exit 1
          fi
          if grep -q '\.dmg' release-assets/appcast.xml; then
            echo "Appcast must stay on the zip so updates replace the app in Applications." >&2
            exit 1
          fi

      - name: Add stable website download
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cp "release-assets/Ichido-${VERSION}-macOS.zip" \
            release-assets/Ichido-macOS.zip
          cmp "release-assets/Ichido-${VERSION}-macOS.zip" \
            release-assets/Ichido-macOS.zip

      - name: Build the drag-to-Applications disk image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "${SIGN_IDENTITY:-}" || "${SIGN_IDENTITY}" == "-" ]]; then
            echo "SIGN_IDENTITY is missing. Refusing an unsigned disk image." >&2
            exit 1
          fi
          ./scripts/make-dmg.sh "build/Ichido.app" "release-assets/Ichido-${VERSION}-macOS.dmg"
          codesign --force --sign "$SIGN_IDENTITY" --timestamp \
            --keychain "${RUNNER_TEMP}/ichido-signing.keychain-db" \
            "release-assets/Ichido-${VERSION}-macOS.dmg"
          codesign --verify --verbose=2 "release-assets/Ichido-${VERSION}-macOS.dmg"

      - name: Delete temporary keychain
        if: always()
        run: |
          set -euo pipefail
          KEYCHAIN="${RUNNER_TEMP}/ichido-signing.keychain-db"
          if [[ -f "${RUNNER_TEMP}/ichido-keychain-list.txt" ]]; then
            set -f
            security list-keychains -d user -s $(sed 's/"//g' "${RUNNER_TEMP}/ichido-keychain-list.txt") || true
            set +f
          fi
          if [[ -f "$KEYCHAIN" ]]; then
            security delete-keychain "$KEYCHAIN" || true
          fi
          rm -f \
            "${RUNNER_TEMP}/developer-id.p12" \
            "${RUNNER_TEMP}/AuthKey.p8" \
            "${RUNNER_TEMP}/ichido-keychain-list.txt"

      - name: Notarize the disk image
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          ./scripts/notarize-submit.sh "release-assets/Ichido-${VERSION}-macOS.dmg"

      - name: Staple the disk image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          DMG="release-assets/Ichido-${VERSION}-macOS.dmg"
          stapled=0
          for attempt in 1 2 3 4 5; do
            if xcrun stapler staple "$DMG"; then
              stapled=1
              break
            fi
            if [[ "$attempt" -lt 5 ]]; then
              sleep 20
            fi
          done
          if [[ "$stapled" -ne 1 ]]; then
            echo "stapler staple failed for the disk image." >&2
            exit 1
          fi
          # Missing staple fails here. Do not catch this exit.
          xcrun stapler validate "$DMG"

          # A headless runner assesses a stapled disk image as
          # source=Insufficient Context unless this context is set.
          # That source is not an Apple rejection once stapler validate passed.
          # Unnotarized and "no usable signature" still fail the job.
          classify_dmg_spctl() {
            local out="$1"
            local status="$2"
            local sources source_line only_insufficient
            if [[ "$status" -eq 0 ]] && printf '%s\n' "$out" | grep -q "Notarized Developer ID"; then
              return 0
            fi
            if printf '%s\n' "$out" | grep -q "Unnotarized" \
              || printf '%s\n' "$out" | grep -q "no usable signature"; then
              return 2
            fi
            sources="$(printf '%s\n' "$out" | sed -n 's/^source=//p')"
            only_insufficient=0
            if [[ -n "$sources" ]]; then
              only_insufficient=1
              while IFS= read -r source_line; do
                if [[ "$source_line" != "Insufficient Context" ]]; then
                  only_insufficient=0
                  break
                fi
              done <<< "$sources"
            fi
            if [[ "$only_insufficient" -eq 1 ]]; then
              return 0
            fi
            return 1
          }

          accepted=0
          spctl_out=""
          for attempt in 1 2 3 4 5; do
            spctl_status=0
            spctl_out="$(/usr/sbin/spctl -a -vvv -t open --context context:primary-signature "$DMG" 2>&1)" || spctl_status=$?
            printf '%s\n' "$spctl_out"
            class=0
            classify_dmg_spctl "$spctl_out" "$spctl_status" || class=$?
            if [[ "$class" -eq 0 ]]; then
              if ! printf '%s\n' "$spctl_out" | grep -q "Notarized Developer ID"; then
                echo "spctl returned only source=Insufficient Context. stapler validate already passed."
              fi
              accepted=1
              break
            fi
            if [[ "$class" -eq 2 ]]; then
              echo "spctl rejected the disk image." >&2
              exit 1
            fi
            if [[ "$attempt" -lt 5 ]]; then
              sleep 20
            fi
          done
          if [[ "$accepted" -ne 1 ]]; then
            echo "spctl did not accept the disk image as Notarized Developer ID." >&2
            exit 1
          fi
          cp "$DMG" release-assets/Ichido-macOS.dmg
          cmp "$DMG" release-assets/Ichido-macOS.dmg
          if grep -q '\.dmg' release-assets/appcast.xml; then
            echo "Appcast must stay on the zip so updates replace the app in Applications." >&2
            exit 1
          fi

      - name: Upload notarized dry-run artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: Ichido-notarized-${{ steps.version.outputs.version }}-macOS
          path: release-assets/
          if-no-files-found: error

      - name: Create GitHub Release
        if: ${{ inputs.publish == true && startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "Refusing to publish: this ref is not a v* tag." >&2
            exit 1
          fi
          ZIP="release-assets/Ichido-${VERSION}-macOS.zip"
          DMG="release-assets/Ichido-${VERSION}-macOS.dmg"
          test -s "${ZIP}"
          test -s release-assets/Ichido-macOS.zip
          test -s "${DMG}"
          test -s release-assets/Ichido-macOS.dmg
          test -s release-assets/appcast.xml
          NOTES="$(mktemp)"
          TAG_MSG="$(git tag -l --format='%(contents)' "${TAG}" | sed '/^-----BEGIN PGP SIGNATURE-----$/,$d')"
          TAG_MSG="${TAG_MSG%"${TAG_MSG##*[![:space:]]}"}"
          {
            echo "This download is signed with Developer ID and notarized by Apple. Open the disk image and drag **Ichido** to Applications."
            echo
            echo "It is a direct download, not a Mac App Store install."
            echo
            echo "The download does **not** include the Parakeet / NeMo-Speech model. On-device transcription is an optional later download (**Settings → Transcription**)."
            echo
            if [[ -n "${TAG_MSG}" ]]; then
              echo "## Tag message"
              echo
              printf '%s\n' "${TAG_MSG}"
              echo
            fi
          } > "${NOTES}"
          gh release create "${TAG}" "${ZIP}" release-assets/Ichido-macOS.zip "${DMG}" release-assets/Ichido-macOS.dmg release-assets/appcast.xml \
            --title "Ichido ${VERSION}" \
            --notes-file "${NOTES}" \
            --latest \
            --verify-tag
